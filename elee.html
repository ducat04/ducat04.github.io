<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elee.py</title>
<style>
body {
  margin: 0;
  font-family: Lucida Console, monospace;
  font-size: 14px;
  color: #ccc;
  background: #000;
  text-align: center;
  overflow: hidden;
}
#bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -2;
}
#bg video, #bg img {
  width: 100%; height: 100%;
  object-fit: cover;
}
#overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000;
  opacity: 0.55;
  z-index: -1;
}
#container {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, 90vw);
  min-height: 400px;
  padding: 20px;
  border: 1px solid #222;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}
#avatar {
  width: clamp(90px, 8vw, 120px);
  height: clamp(90px, 8vw, 120px);
  border-radius: 50%;
  border: 1px solid #333;
  margin-bottom: 12px;
}
#username {
  color: #fff;
  font-size: clamp(18px, 2vw, 22px);
  margin: 4px 0;
}
#bio {
  color: #a0a0ff;
  font-size: 13px;
  margin-bottom: 14px;
  text-align: center;
  padding: 0 10px;
}
#links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}
#links a {
  color: #aaa;
  background: #111;
  border: 1px solid #222;
  padding: 6px 10px;
  text-decoration: none;
  font-size: 12px;
  transition: 0.2s;
}
#links a:hover {
  background: #222;
  color: #fff;
  border-color: #444;
}
#watermark {
  position: fixed;
  bottom: 10px; right: 10px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid #222;
  padding: 6px 10px;
  font-size: 10px;
  color: #666;
  backdrop-filter: blur(4px);
}
#watermark a {
  color: #888;
  text-decoration: none;
}
#watermark a:hover { color: #fff; }

#music-player {
  margin-top: 14px;
  width: 100%;
  border: 1px solid #222;
  background: rgba(0, 0, 0, 0.4);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-sizing: border-box;
}
#mp-art {
  width: 46px; height: 46px;
  object-fit: cover;
  border: 1px solid #333;
  flex-shrink: 0;
}
#mp-info { flex: 1; min-width: 0; }
#mp-title {
  color: #fff;
  font-size: 11px;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#mp-artist {
  color: #888;
  font-size: 10px;
  margin-bottom: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#mp-progress {
  display: flex;
  align-items: center;
  gap: 6px;
}
#mp-cur, #mp-dur {
  color: #aaa;
  font-size: 10px;
  min-width: 26px;
}
#mp-dur { text-align: right; }
#mp-track {
  flex: 1;
  height: 2px;
  background: #333;
  cursor: pointer;
  position: relative;
}
#mp-fill {
  height: 100%;
  background: #ffffff;
  width: 0%;
  pointer-events: none;
}
#mp-thumb {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ffffff;
  left: 0%;
  margin-left: -4px;
  pointer-events: none;
}
#mp-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
#mp-controls svg { cursor: pointer; }

@media screen and (max-width: 600px) {
  #container { width: 90vw; }
}
</style>
</head>
<body>

<div id="bg">
  <img src="pfps/elee-bg.jpg" alt="">
</div>
<div id="overlay"></div>

<audio id="mp-audio" src="pfps/elee-song.mp3" autoplay loop muted></audio>

<div id="container">
  <img id="avatar" src="pfps/elee-pfp.jpg">
  <div id="username">elee/eleepy/1MA</div> <!-- username-->
  <div id="bio">trans gal, 1M+A leader, graphist, dev, love S.V.S.F.E.M (look up on genius rap)</div> <!-- bio -->
  <div id="links">
    <a href="https://steamcommunity.com/id/ocre-elee">Steam</a> <!-- buttons that go to links -->
    <a href="https://youtube.com/@puritygd">Youtube</a> <!-- buttons that go to links -->
    <a href="https://patreon.com/eleepy">Patreon</a> <!-- buttons that go to links -->
    <a href="https://discord.gg/YddvDM4A">Add me on discord !</a>
    <a href="https://stormprvt.netlify.app/">Spotify NigthX (need premium)</a>
  </div>

  <div id="music-player">
    <img id="mp-art" src="pfps/cover.png" alt="">
    <div id="mp-info">
      <div id="mp-title">Tuer la Bete La_Bete</div> <!-- change song/artist name herw -->
      <div id="mp-artist">FEMTOGO</div>
      <div id="mp-progress">
        <span id="mp-cur">0:00</span>
        <div id="mp-track">
          <div id="mp-fill"></div>
          <div id="mp-thumb"></div>
        </div>
        <span id="mp-dur">0:00</span>
      </div>
    </div>
    <div id="mp-controls">
      <svg id="mp-prev" width="13" height="13" viewBox="0 0 16 16" fill="#888">
        <path d="M2 2h2v12H2zM14 3L6 8l8 5z"/>
      </svg>
      <svg id="mp-play" width="18" height="18" viewBox="0 0 16 16" fill="#fff">
        <path d="M4 2l10 6-10 6z"/>
      </svg>
      <svg id="mp-next" width="13" height="13" viewBox="0 0 16 16" fill="#888">
        <path d="M12 2h2v12h-2zM2 3l8 5-8 5z"/>
      </svg>
    </div>
  </div>
</div>

<div id="watermark">
  made by <a href="https://ducat.lol" target="_blank">ducat</a> <!-- pls dont delete watermark -->
</div>

<script>
  const audio  = document.getElementById('mp-audio');
  const mCurEl = document.getElementById('mp-cur');
  const mDurEl = document.getElementById('mp-dur');
  const mFill  = document.getElementById('mp-fill');
  const mThumb = document.getElementById('mp-thumb');
  const mBtn   = document.getElementById('mp-play');
  const mTrack = document.getElementById('mp-track');
  const mPrev  = document.getElementById('mp-prev');
  const mNext  = document.getElementById('mp-next');

  const pauseIcon = `<rect x="3" y="2" width="3" height="12" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/>`;
  const playIcon  = `<path d="M4 2l10 6-10 6z"/>`;

  function fmt(s) {
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }

  audio.muted = false;

  audio.play().then(() => {
    mBtn.innerHTML = pauseIcon;
  }).catch(() => {
    document.addEventListener('click', () => {
      audio.muted = false;
      audio.play();
      mBtn.innerHTML = pauseIcon;
    }, { once: true });
  });

  audio.addEventListener('loadedmetadata', () => {
    mDurEl.textContent = fmt(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = (audio.currentTime / audio.duration * 100).toFixed(2) + '%';
    mFill.style.width = pct;
    mThumb.style.left = pct;
    mCurEl.textContent = fmt(audio.currentTime);
  });

  mBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      mBtn.innerHTML = pauseIcon;
    } else {
      audio.pause();
      mBtn.innerHTML = playIcon;
    }
  });

  mTrack.addEventListener('click', e => {
    const r = mTrack.getBoundingClientRect();
    audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
  });

  [mPrev, mNext].forEach(b => {
    b.addEventListener('mouseover', () => b.style.fill = '#fff');
    b.addEventListener('mouseout',  () => b.style.fill = '#888');
  });
  mBtn.addEventListener('mouseover', () => mBtn.style.fill = '#fff');
  mBtn.addEventListener('mouseout', () => mBtn.style.fill = '#d0d0d0');
</script>

</body>
</html>
